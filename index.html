<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#124a59"><meta name="description" content="HABLA: práctica autónoma de comunicación y lenguaje, gratis y sin registro."><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./styles.css"><title>HABLA · Practica a tu ritmo</title></head><body>
<a class="skip" href="#main">Ir al contenido</a>
<header class="topbar"><button id="brand" class="brand" type="button" aria-label="Ir a inicio"><span class="brandmark">H</span><span>HABLA<small>Practica a tu ritmo</small></span></button><div class="head-actions"><button class="simple" id="settingsBtn" type="button">⚙ Ajustes</button><span class="connection" id="connection" role="status">●</span></div></header>
<aside id="sessionTimer" class="session-timer" hidden aria-label="Tiempo de práctica"><div class="timer-details"><strong>⏱ <output id="sessionClock">00:00</output></strong><label><span class="sr-only">Meta orientativa</span><select id="sessionDuration" aria-label="Tiempo orientativo de práctica"><option value="300">5 minutos</option><option value="600">10 minutos</option><option value="900">15 minutos</option><option value="1200">20 minutos</option></select></label><span class="sr-only" id="sessionTarget">10:00</span></div><div class="timer-buttons"><button type="button" id="sessionToggle" class="simple">Ⅱ Pausar</button><button type="button" id="sessionEnd" class="simple">Finalizar</button></div><p id="sessionNotice" role="status" class="session-notice"></p></aside><main id="main" tabindex="-1"><div id="app" aria-live="off"></div></main>
<footer class="footer">Una herramienta gratuita para practicar, no sustituye la atención profesional. <span id="footState"></span></footer>
<dialog id="settings" aria-labelledby="settingsTitle"><form method="dialog"><div class="dialog-head"><h2 id="settingsTitle">Ajustes de accesibilidad</h2><button class="simple" value="close" aria-label="Cerrar ajustes">✕</button></div><label class="row">Texto más grande <input type="checkbox" id="largeText"></label><label class="row">Alto contraste <input type="checkbox" id="contrast"></label><label class="row">Reducir animaciones <input type="checkbox" id="reduceMotion"></label><label class="row">Ver pictogramas en comunicación <input type="checkbox" id="showIcons"></label><label class="field">Velocidad de voz <select id="speechRate"><option value="0.75">Más lenta</option><option value="0.9">Lenta</option><option value="1">Normal</option></select></label><p class="hint">La voz de lectura depende de las voces instaladas en tu dispositivo y puede no estar disponible sin internet.</p><button class="button primary full" value="close">Listo</button></form></dialog>
<script src="./app.js" defer></script></body></html>
